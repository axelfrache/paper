name: paper

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paper
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  garage:
    build:
      context: ./services/garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-GK31c2f27ecc0e4d0c1928e5fa}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-7d37e5a2f7c18b4e9d5f6a2c3b4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e}
      GARAGE_BUCKET: ${S3_BUCKET:-paper-images}
    volumes:
      - ./services/garage/garage.toml:/etc/garage.toml:ro
      - ./services/garage/entrypoint.sh:/entrypoint.sh:ro
      - garage-data:/var/lib/garage
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/garage-ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "${GARAGE_PORT:-3902}:3900"

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://paper:paper@postgres:5432/paper?sslmode=disable}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-ai-gateway}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8081}
      AI_API_KEY: ${AI_API_KEY:-${AI_GATEWAY_API_KEY:-}}
      AI_MODEL: ${AI_MODEL:-ai-gateway:json}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:-GK31c2f27ecc0e4d0c1928e5fa}
      S3_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:-7d37e5a2f7c18b4e9d5f6a2c3b4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e}
      S3_BUCKET: ${S3_BUCKET:-paper-images}
      S3_REGION: ${S3_REGION:-garage}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres-data:
  garage-data:
