name: paper

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paper
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  paper:
    image: paper:local
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://paper:paper@postgres:5432/paper?sslmode=disable}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-${AI_GATEWAY_API_KEY:-}}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-filesystem}
      FILESYSTEM_STORAGE_PATH: ${FILESYSTEM_STORAGE_PATH:-/var/lib/paper/uploads}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-dev}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:5173}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      AUTH_LOCAL_ADMIN_EMAIL: ${AUTH_LOCAL_ADMIN_EMAIL:-}
      AUTH_LOCAL_ADMIN_PASSWORD: ${AUTH_LOCAL_ADMIN_PASSWORD:-}
      AUTH_LOCAL_ADMIN_NAME: ${AUTH_LOCAL_ADMIN_NAME:-Administrator}
      AUTH_DEV_USER_ID: ${AUTH_DEV_USER_ID:-dev-user}
      AUTH_DEV_EMAIL: ${AUTH_DEV_EMAIL:-developer@paper.local}
      AUTH_DEV_NAME: ${AUTH_DEV_NAME:-Local developer}
      AUTH_DEV_ROLES: ${AUTH_DEV_ROLES:-paper-admin}
      AUTH_LEGACY_OWNER_ID: ${AUTH_LEGACY_OWNER_ID:-dev-user}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://auth.getquestify.com/realms/paper}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-paper}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-http://localhost:5173/api/auth/callback}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${FRONTEND_PORT:-5173}:8080"
    volumes:
      - paper-uploads:/var/lib/paper/uploads

volumes:
  postgres-data:
  paper-uploads:
